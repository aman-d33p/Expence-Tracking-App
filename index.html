<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f0f2f5;
            padding: 20px;
            max-width: 450px;
            margin: 0 auto;
        }

        .container {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 24px;
        }

        .balance-box {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
        }

        .balance-box h2 {
            font-size: 16px;
            opacity: 0.9;
        }

        .balance-box h1 {
            font-size: 32px;
            margin-top: 8px;
            color: white;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: white;
        }

        .btn-income {
            background: #28a745;
        }

        .btn-expense {
            background: #dc3545;
        }

        .form-box {
            display: none;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .form-box input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-box button {
            width: 100%;
            padding: 10px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
            margin-top: 5px;
        }

        .transactions {
            margin-top: 10px;
        }

        .transactions h3 {
            margin-bottom: 12px;
            color: #333;
        }

        .transaction {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: #f8f9fa;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 5px solid;
        }

        .income-border {
            border-left-color: #28a745;
        }

        .expense-border {
            border-left-color: #dc3545;
        }

        .transaction-info h4 {
            font-size: 15px;
            color: #333;
        }

        .transaction-info p {
            font-size: 12px;
            color: #777;
            margin-top: 3px;
        }

        .amount {
            font-weight: bold;
            font-size: 16px;
        }

        .income-amount {
            color: #28a745;
        }

        .expense-amount {
            color: #dc3545;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #dc3545;
            font-size: 18px;
            cursor: pointer;
            margin-left: 10px;
        }

        .empty {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Expense Tracker</h1>

        <div class="balance-box">
            <h2>Current Balance</h2>
            <h1 id="balance">Rs. 0.00</h1>
        </div>

        <div class="buttons">
            <button class="btn btn-income" onclick="showForm('income')">+ Income</button>
            <button class="btn btn-expense" onclick="showForm('expense')">- Expense</button>
        </div>

        <div class="form-box" id="formBox">
            <input type="text" id="description" placeholder="Description (e.g. Salary, Food)">
            <input type="number" id="amount" placeholder="Amount">
            <button onclick="addTransaction()">Add</button>
        </div>

        <div class="transactions">
            <h3>Transactions</h3>
            <div id="transactionList">
                <div class="empty">No transactions yet</div>
            </div>
        </div>
    </div>

    <script>
        var transactions = JSON.parse(localStorage.getItem("transactions")) || [];
        var currentType = "";

        function showForm(type) {
            currentType = type;
            document.getElementById("formBox").style.display = "block";
            document.getElementById("description").value = "";
            document.getElementById("amount").value = "";
        }

        function addTransaction() {
            var desc = document.getElementById("description").value.trim();
            var amount = parseFloat(document.getElementById("amount").value);

            if (!desc || !amount || amount <= 0) {
                alert("Please enter valid description and amount");
                return;
            }

            var transaction = {
                id: Date.now(),
                description: desc,
                amount: amount,
                type: currentType,
                date: new Date().toLocaleDateString()
            };

            transactions.push(transaction);
            localStorage.setItem("transactions", JSON.stringify(transactions));
            document.getElementById("formBox").style.display = "none";
            updateUI();
        }

        function deleteTransaction(id) {
            transactions = transactions.filter(function(t) {
                return t.id !== id;
            });
            localStorage.setItem("transactions", JSON.stringify(transactions));
            updateUI();
        }

        function updateUI() {
            var balance = 0;
            var html = "";

            if (transactions.length === 0) {
                html = '<div class="empty">No transactions yet</div>';
            } else {
                for (var i = transactions.length - 1; i >= 0; i--) {
                    var t = transactions[i];

                    if (t.type === "income") {
                        balance += t.amount;
                    } else {
                        balance -= t.amount;
                    }

                    var sign = (t.type === "income") ? "+" : "-";
                    var amountClass = (t.type === "income") ? "income-amount" : "expense-amount";
                    var borderClass = (t.type === "income") ? "income-border" : "expense-border";

                    html += '<div class="transaction ' + borderClass + '">';
                    html += '<div class="transaction-info">';
                    html += '<h4>' + t.description + '</h4>';
                    html += '<p>' + t.date + '</p>';
                    html += '</div>';
                    html += '<div style="display:flex; align-items:center;">';
                    html += '<span class="amount ' + amountClass + '">' + sign + 'Rs. ' + t.amount.toFixed(2) + '</span>';
                    html += '<button class="delete-btn" onclick="deleteTransaction(' + t.id + ')">X</button>';
                    html += '</div>';
                    html += '</div>';
                }
            }

            document.getElementById("balance").innerText = "Rs. " + balance.toFixed(2);
            document.getElementById("transactionList").innerHTML = html;
        }

        updateUI();
    </script>
</body>
</html>
